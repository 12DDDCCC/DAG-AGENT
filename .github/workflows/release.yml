name: Release

on:
  push:
    tags: ['v*']

env:
  PYTHONUTF8: '1'
  PYTHONDONTWRITEBYTECODE: '1'

permissions:
  contents: write

jobs:
  build-verify-publish:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Keep checkout bytes stable
        shell: bash
        run: |
          git config core.autocrlf false
          git reset --hard HEAD
      - name: Create clean-checkout working directories
        shell: bash
        run: mkdir -p work/tmp-pytest/release work/tmp-pytest/release-slow work/release-dist
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require tag and project version to match
        shell: pwsh
        run: |
          $content = Get-Content pyproject.toml -Raw
          $match = [regex]::Match($content, '(?m)^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "project version not found" }
          if ($env:GITHUB_REF_NAME -ne "v$($match.Groups[1].Value)") {
            throw "tag $env:GITHUB_REF_NAME != project version v$($match.Groups[1].Value)"
          }
      - name: Install project and development tools
        shell: pwsh
        run: python -m pip install ".[dev]"
      - name: Run regular tests
        shell: pwsh
        run: python -m pytest tests techstack_full_v2/tests techstack_research_v2/tests -m "not slow" --basetemp=work/tmp-pytest/release -q --junitxml=work/release-regular.xml
      - name: Run slow tests
        shell: pwsh
        run: python -m pytest tests techstack_full_v2/tests techstack_research_v2/tests -m slow --basetemp=work/tmp-pytest/release-slow -q --junitxml=work/release-slow.xml
      - name: Run scanner self-test
        shell: pwsh
        run: python scripts/publication_scan.py --self-test
      - name: Scan exact public source
        shell: pwsh
        run: python scripts/publication_scan.py --repo . --out work/publication-scan.json
      - name: Export clean tagged source
        shell: pwsh
        run: python scripts/export_release_subset.py --require-clean --out release_subset/dag-agent-v3.2.1
      - name: Verify source bytes and tag commit
        shell: pwsh
        run: |
          $tagCommit = git rev-list -n 1 $env:GITHUB_REF_NAME
          if ($LASTEXITCODE -ne 0) { throw "tag commit resolution failed" }
          python scripts/verify_release.py release_subset/dag-agent-v3.2.1 --source-repo . --expected-commit $tagCommit
          if ($LASTEXITCODE -ne 0) { throw "tagged release verification failed" }
      - name: Build wheel and sdist
        shell: pwsh
        run: python -m build --outdir work/release-dist release_subset/dag-agent-v3.2.1
      - name: Verify installed wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem work/release-dist/*.whl | Select-Object -First 1
          if ($null -eq $wheel) { throw "wheel not found" }
          python scripts/verify_installed.py --artifact $wheel.FullName --work-dir work/installed-wheel
          if ($LASTEXITCODE -ne 0) { throw "wheel installed verification failed" }
      - name: Verify installed sdist
        shell: pwsh
        run: |
          $sdist = Get-ChildItem work/release-dist/*.tar.gz | Select-Object -First 1
          if ($null -eq $sdist) { throw "sdist not found" }
          python scripts/verify_installed.py --artifact $sdist.FullName --work-dir work/installed-sdist
          if ($LASTEXITCODE -ne 0) { throw "sdist installed verification failed" }
      - name: Assemble release assets and hashes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Copy-Item release_subset/dag-agent-v3.2.1/RELEASE_MANIFEST.json work/release-dist/
          Copy-Item outputs/DAG-agent-v3.2.1-公开发布说明.md work/release-dist/RELEASE-NOTES-v3.2.1.md
          Copy-Item work/release-regular.xml work/release-dist/
          Copy-Item work/release-slow.xml work/release-dist/
          Copy-Item work/installed-wheel/installed-acceptance.json work/release-dist/installed-wheel.json
          Copy-Item work/installed-sdist/installed-acceptance.json work/release-dist/installed-sdist.json
          $files = Get-ChildItem work/release-dist -File | Where-Object Name -ne 'SHA256SUMS' | Sort-Object Name
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          [IO.File]::WriteAllLines((Join-Path (Resolve-Path work/release-dist) 'SHA256SUMS'), $lines)
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:GITHUB_REF_NAME
          $repo = $env:GITHUB_REPOSITORY
          $title = "DAG-agent $tag 技术预览"
          $notes = "work/release-dist/RELEASE-NOTES-v3.2.1.md"
          $assets = Get-ChildItem work/release-dist -File | Sort-Object Name | ForEach-Object FullName
          $assetNames = Get-ChildItem work/release-dist -File | Sort-Object Name | ForEach-Object Name

          & gh release view $tag -R $repo --json tagName | Out-Null
          $viewCode = $LASTEXITCODE
          if ($viewCode -eq 0) {
            $existing = gh release view $tag -R $repo --json assets | ConvertFrom-Json
            foreach ($asset in $existing.assets) {
              if ($assetNames -notcontains $asset.name) {
                & gh release delete-asset $tag $asset.name -y -R $repo
                if ($LASTEXITCODE -ne 0) { throw "stale asset deletion failed: $($asset.name)" }
              }
            }
            & gh release upload $tag $assets --clobber -R $repo
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release asset upload failed" }
            & gh release edit $tag --title $title --notes-file $notes -R $repo
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release update failed" }
          } elseif ($viewCode -eq 1) {
            & gh release create $tag $assets --verify-tag --title $title --notes-file $notes -R $repo
            if ($LASTEXITCODE -ne 0) { throw "GitHub Release creation failed" }
          } else {
            throw "GitHub Release lookup failed with exit code $viewCode"
          }
